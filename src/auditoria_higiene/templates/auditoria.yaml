# Repository hygiene auditor configuration
# Rules, severities, and exceptions for automated checks

config_version: 1

rules:
  tracked_secrets:
    enabled: true
    severity: error
  broken_internal_links:
    enabled: true
    severity: error
  missing_references:
    enabled: true
    severity: error
  untracked_artifacts:
    enabled: true
    severity: error
    # Optional: limit alerts to generated artifact patterns.
    # artifact_patterns: [".ruff_cache/", ".pytest_cache/", "dist/"]
  empty_gitkeep_directories:
    enabled: true
    severity: warning
  unreferenced_files:
    enabled: true
    severity: warning
  outdated_documentation:
    enabled: true
    severity: warning
  unintegrated_configurations:
    enabled: true
    severity: warning
  stale_openspec_changes:
    enabled: true
    severity: warning
  insecure_workflows:
    enabled: true
    severity: warning
    # Write permissions required by the workflow can be explicitly allowed.
    allowed_write_permissions: [issues]
  conventional_commits:
    enabled: true
    severity: warning

exceptions:
  tracked_secrets:
    - .secrets.baseline
    - .env.example
  broken_internal_links: []
  missing_references:
    - auditoria-report.txt
  untracked_artifacts:
    - .git
  empty_gitkeep_directories: []
  unreferenced_files:
    - .gitignore
    - Makefile
  outdated_documentation: []
  unintegrated_configurations: []
  stale_openspec_changes: []
  insecure_workflows: []
  conventional_commits: []
