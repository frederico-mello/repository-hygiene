name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv

      - name: Install test runner
        run: "uv pip install --only-binary=:all: pytest==8.3.4 PyYAML==6.0.2"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run --no-project pytest tests_package/ -q

  install-flow:
    name: install flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Build package
        run: uv build

      - name: uvx install (ephemeral)
        run: |
          mkdir -p /tmp/consumer
          git init /tmp/consumer
          uvx --no-build --find-links dist --from repository-hygiene==1.0.0 --with PyYAML==6.0.2 repository-hygiene install /tmp/consumer
          test -f /tmp/consumer/auditoria.yaml
          test -f /tmp/consumer/.github/workflows/repository-hygiene.yml
          test -f /tmp/consumer/.opencode/skills/agent-hygiene-flow/SKILL.md

      - name: uv tool install (persistent)
        run: |
          uv tool install --force --no-build --find-links dist repository-hygiene==1.0.0
          uv tool list | grep repository-hygiene
          uv tool run --no-build --find-links dist --from repository-hygiene==1.0.0 repository-hygiene --version

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
