name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv

      - name: Install test runner
        run: "uv pip install --only-binary :all: 'pytest==8.3.4'"

      - name: Install package
        run: uv pip install -e .

      - name: Run tests
        run: uv run --frozen pytest tests_package/ -q

  install-flow:
    name: install flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Build package
        run: uv build

      - name: Find wheel file
        id: find-wheel
        run: echo "wheel=$(ls dist/*.whl | head -1)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: uvx install (ephemeral)
        run: |
          mkdir -p /tmp/consumer
          git init /tmp/consumer
          uvx --from '${{ steps.find-wheel.outputs.wheel }}' 'repository-hygiene==0.2.0' install /tmp/consumer
          test -f /tmp/consumer/auditoria.yaml
          test -f /tmp/consumer/.github/workflows/repository-hygiene.yml
          test -f /tmp/consumer/.opencode/skills/agent-hygiene-flow/SKILL.md

      - name: uv tool install (persistent)
        run: |
          uv tool install --force ${{ steps.find-wheel.outputs.wheel }}
          uv tool list | grep repository-hygiene
          uv tool run --from '${{ steps.find-wheel.outputs.wheel }}' 'repository-hygiene==0.2.0' --version

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-actionlint@v1
