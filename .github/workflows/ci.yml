name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv

      - name: Install test runner
        run: |
          uv pip install --only-binary=:all: pytest==8.3.4
          uv pip install --only-binary=:all: PyYAML==6.0.3

      - name: Build package
        run: uv build

      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          uv pip install --require-hashes --only-binary :all: -r .github/workflows/requirements-ci.lock
          if [[ -f .venv/bin/activate ]]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          python -m pytest tests_package/ -q

  install-flow:
    name: install flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build package
        run: uv build

      - name: uvx install (ephemeral)
        shell: bash
        run: |
          mkdir -p /tmp/consumer
          git init /tmp/consumer
          uvx --no-build --find-links dist --from repository-hygiene==1.0.0 --with PyYAML==6.0.3 repository-hygiene install /tmp/consumer
          test -f /tmp/consumer/auditoria.yaml
          test -f /tmp/consumer/.github/workflows/repository-hygiene.yml
          test -f /tmp/consumer/.opencode/skills/agent-hygiene-flow/SKILL.md

      - name: uv tool install (persistent)
        shell: bash
        run: |
          uv tool install --force --no-build --find-links dist repository-hygiene==1.0.0
          uv tool list | grep repository-hygiene
          uv tool run --no-build --find-links dist --from repository-hygiene==1.0.0 repository-hygiene --version

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
